# Static demo (sandbox editor + Foxhole theme) deployed to GitHub Pages.
#
# The full Homebrewery app needs Node.js + MongoDB and cannot run on Pages;
# this ships the client-only sandbox: the /new editor works from localStorage
# with a static /api/theme/* stub, so the Foxhole theme is live and editable.
# NOTE: the built client uses root-absolute URLs, so the Pages site must be
# served from the domain root (custom domain, or a <user>.github.io repo).
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pages-demo.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
